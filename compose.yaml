services:
  postgres:
    image: postgres:16-alpine
    container_name: chatflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatflow_secret}
      POSTGRES_DB: ${POSTGRES_DB:-chatflow_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chatflow} -d ${POSTGRES_DB:-chatflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: chatflow_postgres_data
